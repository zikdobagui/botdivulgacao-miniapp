<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Em breve: novidades no nosso Mini App.">
  <title>Mini App · Em breve</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 24px; font-family: system-ui, sans-serif; color: var(--tg-theme-text-color, #edf3ff); background: var(--tg-theme-bg-color, #101724); }
    main { width: 100%; max-width: 400px; text-align: center; }
    .icon { display: grid; place-items: center; width: 84px; height: 84px; margin: 0 auto 32px; border-radius: 24px; background: var(--tg-theme-secondary-bg-color, #1c2a40); font-size: 38px; }
    .label { color: var(--tg-theme-link-color, #8bbaff); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 14px 0; font-size: clamp(40px, 11vw, 56px); line-height: 1.1; letter-spacing: -.045em; }
    p { margin: 0 auto; max-width: 300px; color: var(--tg-theme-hint-color, #aab7cc); font-size: 16px; line-height: 1.7; }
    button { width: 100%; margin-top: 36px; padding: 16px; border: 0; border-radius: 14px; font: inherit; font-weight: 650; color: var(--tg-theme-button-text-color, #ffffff); background: var(--tg-theme-button-color, #3478e5); cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--tg-theme-link-color, #8bbaff); outline-offset: 4px; }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🚀</div>
    <span class="label">Mini App</span>
    <h1>Em breve.</h1>
    <p>Estamos preparando novidades para você. Logo este espaço vai ganhar vida!</p>
    <button id="close" type="button" hidden>Voltar para o bot</button>
  </main>
  <script>
    const app = window.Telegram && window.Telegram.WebApp;
    if (app && app.initData) {
      app.ready();
      app.expand();
      const close = document.getElementById('close');
      close.hidden = false;
      close.addEventListener('click', () => app.close());
    }
  </script>
</body>
</html>
